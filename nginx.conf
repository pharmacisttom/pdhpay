# ==========================================
# Nginx Reverse Proxy Configuration for PDH Pay
# Place at /etc/nginx/sites-available/pdhpay or /etc/nginx/conf.d/pdhpay.conf
# ==========================================

# Upstream Next.js Application Server
upstream pdhpay_app {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name pdhpay.pluakdaenghospital.cloud localhost;

    return 301 https://$host$request_uri;
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pdhpay.pluakdaenghospital.cloud localhost;

    # SSL Certificates (Let's Encrypt / Certbot path example)
    ssl_certificate /etc/letsencrypt/live/pdhpay.pluakdaenghospital.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdhpay.pluakdaenghospital.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Upload Limit (10MB for slip images)
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_comp_level 6;
    gzip_min_length 1000;

    # Next.js Static Files Caching
    location /_next/static/ {
        alias /app/.next/static/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public Static Assets
    location /brand/ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Proxy all request traffic to Next.js Application Server
    location / {
        proxy_pass http://pdhpay_app;
        proxy_http_version 1.1;

        # WebSockets Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Reverse Proxy Headers for Next.js App Router
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for heavy operations (OCR & Sheets sync)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
