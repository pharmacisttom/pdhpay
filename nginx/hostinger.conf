# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION FOR HOSTINGER VPS
# Domain: pdhpay.pluakdaenghospital.cloud
# Target Container: http://127.0.0.1:3000
# ==============================================================================

# HTTP Server Block: Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name pdhpay.pluakdaenghospital.cloud yourdomain.com;

    # Allow Let's Encrypt Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block: Production SSL Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pdhpay.pluakdaenghospital.cloud yourdomain.com;

    # SSL Certificates (Let's Encrypt paths)
    ssl_certificate /etc/letsencrypt/live/pdhpay.pluakdaenghospital.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdhpay.pluakdaenghospital.cloud/privkey.pem;

    # SSL Optimization Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Max Upload Body Size (20MB for slip images)
    client_max_body_size 20M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Cache Next.js Static Assets (_next/static) for 1 year immutable
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public Uploaded Slips Caching
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    # Main Reverse Proxy Location to Next.js Container
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeout Settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
