# Include in nginx http context. Replace host and certificate paths.
limit_req_zone $binary_remote_addr zone=tomvis_auth:10m rate=10r/m;
server {
  listen 80;
  server_name core.example.com;
  return 301 https://core.example.com$request_uri;
}
server {
  listen 443 ssl;
  server_name core.example.com;
  ssl_certificate /etc/letsencrypt/live/core.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/core.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 16k;
  location /api/v1/auth/ {
    limit_req zone=tomvis_auth burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
